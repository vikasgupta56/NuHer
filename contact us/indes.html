<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="assessment">

        <div class="container">

            <!-- LOGO -->
            <div class="logo">
                <img src="../assets/logo/Logo-1-removebg-preview.png" alt="">
            </div>


            <div class="wrapper">

                <div class="top">
                    <div class="progress-top">
                        <span>Start Test</span>
                        <span>Result</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>

                    <button class="back">← Back</button>

                </div>


                <div class="card">

                    <h2>
                        Which statement best describes why you’re
                        taking this assessment today?
                    </h2>

                    <div class="options">

                        <div class="option">
                            <span>I’m just curious</span>
                            <div class="circle"></div>
                        </div>

                        <div class="option">
                            <span>I’ve noticed changes in my periods or mood</span>
                            <div class="circle"></div>
                        </div>

                        <div class="option">
                            <span>My periods have stopped for over a year</span>
                            <div class="circle"></div>
                        </div>

                        <div class="option">
                            <span>I’m seeking specialist treatment or support</span>
                            <div class="circle"></div>
                        </div>

                    </div>

                </div>

                <button class="next">Next</button>
            </div>

            <div class="back-image">
                <img src="../assets/logo/logo-3.png" alt="">
            </div>
        </div>

    </section>

    <script src="script.js"></script>
</body>

</html>
